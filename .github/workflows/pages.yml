name: Publicar app en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        # Raíz = app personal de Yamileth (sin cambios). /beta/ = plataforma multiusuario.
        # Ninguna de las dos carpetas contiene datos de clientes.
        run: |
          mkdir -p _site/beta
          cp -r app/. _site/
          cp -r plataforma/. _site/beta/
          rm -f _site/beta/firestore.rules _site/beta/LEEME_FIREBASE.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
