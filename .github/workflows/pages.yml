name: Publicar app en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        # Ninguna carpeta publicada contiene datos de clientes.
        #  - Repositorio carteraasesor (dominio carteraasesor.com): página en la raíz y la plataforma en /app/.
        #  - Repositorio cartera-imss (github.io): app personal de Yamileth en la raíz y la plataforma en /beta/.
        run: |
          if [ "${{ github.repository }}" = "jonathanaveda-spec/carteraasesor" ]; then
            mkdir -p _site/app
            cp -r sitio/. _site/
            cp -r plataforma/. _site/app/
            rm -f _site/app/firestore.rules _site/app/LEEME_FIREBASE.md
            echo "carteraasesor.com" > _site/CNAME
          else
            mkdir -p _site/beta
            cp -r app/. _site/
            cp -r plataforma/. _site/beta/
            rm -f _site/beta/firestore.rules _site/beta/LEEME_FIREBASE.md
          fi
      - name: Sellar la versión de la plataforma
        # Versión = commit y precarga = todos los archivos: los teléfonos siempre reciben la versión nueva.
        run: |
          if [ -d _site/app ] && [ -f _site/app/sw.js ] && grep -q "cartera-asesor" _site/app/sw.js; then
            python3 tools/sello-sw.py _site/app "${{ github.sha }}"
          fi
          if [ -d _site/beta ]; then
            python3 tools/sello-sw.py _site/beta "${{ github.sha }}"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Cancelar publicaciones colgadas
        # GitHub Pages a veces deja un despliegue anterior "en curso" y rechaza los siguientes
        # ("Please cancel <SHA> first"). Se cancelan los anteriores antes de publicar; el sitio sigue en línea.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10" --jq '.[].sha' | sort -u); do
            if [ "$sha" != "${{ github.sha }}" ]; then
              gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "Cancelado $sha" || true
            fi
          done
      - id: deployment
        uses: actions/deploy-pages@v4
