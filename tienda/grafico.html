<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Gráfico de funciones — Google Play (1024×500)</title>
<!-- Gráfico de funciones de Google Play (1024×500, marca Cartera Asesor: skill marca-cartera-asesor).
     Se fotografía con:  MSYS_NO_PATHCONV=1 node tools/foto-html.mjs /tienda/grafico.html tienda/grafico-funciones.png 1024 500
     Usa la captura limpia (inventada) tienda/capturas/crudas/1-inicio.png: si falta, correr node tools/capturas-play.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@600;800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { position: relative; color: #fff; font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    background: radial-gradient(620px 360px at 18% 0%, rgba(26, 163, 245, .50), transparent 70%), linear-gradient(170deg, #0B2A6F 0%, #1D4ED8 100%); }
  .izq { position: absolute; left: 64px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .marca { display: flex; align-items: center; gap: 22px; }
  .marca img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 14px 34px rgba(3, 10, 40, .45); }
  h1 { margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 66px; line-height: 1.0; letter-spacing: -2px; }
  .frase { margin: 30px 0 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1px; }
  .frase b { color: #FFD166; font-weight: 800; }
  .estados { margin-top: 30px; display: flex; gap: 10px; }
  .estados span { display: inline-flex; align-items: center; gap: 9px; background: rgba(11, 42, 111, .55); border: 1.5px solid rgba(219, 232, 255, .28);
    padding: 9px 16px; border-radius: 999px; font-size: 20px; font-weight: 800; color: #fff; }
  .estados i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .tel { position: absolute; right: 70px; top: 54px; width: 262px; padding: 9px 9px 0; border-radius: 40px 40px 0 0; background: #0f172a;
    box-shadow: 0 24px 60px rgba(3, 10, 40, .55), inset 0 0 0 2px #334155; height: 470px; overflow: hidden; }
  .tel img { display: block; width: 100%; border-radius: 32px 32px 0 0; }
</style></head>
<body>
  <div class="izq">
    <div class="marca"><img src="../plataforma/icons/icon-512.png" alt=""><h1>Cartera<br>Asesor</h1></div>
    <p class="frase">Tu cartera de clientes,<br>organizada y <b>al día</b>.</p>
    <div class="estados">
      <span><i style="background:#16A34A"></i>Al día</span>
      <span><i style="background:#D97706"></i>Por vencer</span>
      <span><i style="background:#DC2626"></i>Moroso</span>
    </div>
  </div>
  <div class="tel"><img src="capturas/crudas/1-inicio.png" alt=""></div>
</body></html>
