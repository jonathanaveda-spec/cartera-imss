<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Marco de captura</title>
<!-- Marco para las capturas de Google Play (1080×1920): título arriba y la pantalla de la app dentro de un teléfono.
     Uso: marco.html?img=/tienda/capturas/crudas/1.png&t=Título&s=Subtítulo  (lo usa tools/capturas-play.mjs) -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, Roboto, sans-serif; color: #fff; text-align: center;
    background: radial-gradient(1200px 700px at 50% 0%, rgba(26, 163, 245, .55), transparent 70%), linear-gradient(170deg, #0b2a6f 0%, #1d4ed8 60%, #1e40af 100%); }
  .texto { position: absolute; top: 0; left: 0; right: 0; height: 430px; display: flex; flex-direction: column; justify-content: center; padding: 40px 80px 0; }
  h1 { margin: 0; font-size: 76px; line-height: 1.08; font-weight: 800; letter-spacing: -1.5px; text-wrap: balance; }
  p { margin: 22px 0 0; font-size: 38px; line-height: 1.3; color: #dbe8ff; text-wrap: balance; }
  .telefono { position: absolute; top: 470px; left: 50%; transform: translateX(-50%); width: 830px; padding: 22px; border-radius: 86px;
    background: #0f172a; box-shadow: 0 40px 90px rgba(3, 10, 40, .55), inset 0 0 0 3px #334155; }
  .telefono img { display: block; width: 100%; border-radius: 64px; }
</style></head>
<body>
  <div class="texto"><h1 id="t"></h1><p id="s"></p></div>
  <div class="telefono"><img id="img" alt=""></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('t').textContent = q.get('t') || '';
    document.getElementById('s').textContent = q.get('s') || '';
    const img = document.getElementById('img');
    img.onload = () => { document.body.dataset.listo = '1'; };
    img.src = q.get('img');
  </script>
</body></html>
