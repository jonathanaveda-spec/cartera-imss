<style>

.txt { font-weight: 800; font-size: 48px; line-height: 1.18; letter-spacing: -0.5px; }

.anillo.verde { border-color: #16A34A; box-shadow: 0 0 0 8px rgba(255,255,255,0.35), 0 0 40px #16A34A; }

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="13.8" data-width="1080" data-height="1920">

<script>
const tl = gsap.timeline({ paused: true });
const E = "expo.out";
tl.fromTo("#glow", { x: -70, y: 0 }, { x: 70, y: 40, duration: 13.8, ease: "none" }, 0);
// Titular: entra línea por línea, grande al centro; sube y se achica cuando llega la primera línea
tl.fromTo("#tit .t0", { opacity: 0.45, y: 40 }, { opacity: 1, y: 0, duration: 0.333, ease: E }, 0);
tl.fromTo("#tit .t1", { opacity: 0.45, y: 40 }, { opacity: 1, y: 0, duration: 0.333, ease: E }, 0.1);
tl.fromTo("#tit .t2", { opacity: 0.45, y: 40 }, { opacity: 1, y: 0, duration: 0.333, ease: E }, 0.2);
tl.to("#tit", { y: -210, scale: 0.6, duration: 0.533, ease: "power2.inOut" }, 3.533);
tl.fromTo("#l0", { opacity: 0, y: 70, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.467, ease: E }, 4);
tl.to("#l0", { backgroundColor: "rgba(6,24,74,0.92)", borderColor: "rgba(255,255,255,0.8)", duration: 0.15 }, 4);
tl.to("#l0", { backgroundColor: "rgba(11,42,111,0.62)", borderColor: "rgba(255,255,255,0.12)", duration: 0.2 }, 6.567);
tl.fromTo("#l1", { opacity: 0, y: 70, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.467, ease: E }, 6.667);
tl.to("#l1", { backgroundColor: "rgba(6,24,74,0.92)", borderColor: "rgba(255,255,255,0.8)", duration: 0.15 }, 6.667);
tl.to("#l1", { backgroundColor: "rgba(11,42,111,0.62)", borderColor: "rgba(255,255,255,0.12)", duration: 0.2 }, 8.867);
tl.fromTo("#l2", { opacity: 0, y: 70, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.467, ease: E }, 8.967);
tl.to("#l2", { backgroundColor: "rgba(6,24,74,0.92)", borderColor: "rgba(255,255,255,0.8)", duration: 0.15 }, 8.967);
tl.to("#l2", { backgroundColor: "rgba(11,42,111,0.62)", borderColor: "rgba(255,255,255,0.12)", duration: 0.2 }, 10.867);
// el contenido se va justo antes del llamado
tl.to("#cuerpo-in", { opacity: 0, duration: 0.333, ease: "power1.in" }, 10.6);
// ll: llamado final
tl.fromTo("#ll-logo", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.533, ease: "back.out(1.2)" }, 10.867);
tl.fromTo("#ll-nombre", { opacity: 0 }, { opacity: 1, duration: 0.467, ease: E }, 11);
tl.fromTo("#ll-t0", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.467, ease: E }, 11.134);
tl.fromTo("#ll-t1", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.467, ease: E }, 11.334);
tl.fromTo("#ll-boton", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.467, ease: "back.out(1.3)" }, 12);
tl.fromTo("#ll-resto", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.467, ease: E }, 12.334);
tl.to("#ll-boton-in", { scale: 1.03, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 12.7);
window.__timelines["main"] = tl;
</script>
